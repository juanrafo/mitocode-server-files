server:
  port: ${CUSTOM.SERVER.PORT:9002}

eureka:
  instance:
    prefer-ip-address: true
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    service-url:      
       defaultZone: ${EUREKA.SERVER.HOSTNAME:http://host.docker.internal:8761/eureka}
    fetchRegistry: true
    healthcheck:
      enable: true
    refresh:
      enable: true


### Mongo database configuration
spring:
  data:
    mongodb:
      host: host.docker.internal
      port: 27017
      database: mitocode
      # username: '{cipher}15dfd68adfe32e63d2ef16b7e1b0b090c7c1a39c824656c1010db7870dd49b04'
      # password: '{cipher}225d9814e6187bd8ab890c72d08bd557185cb3e783a23efec8bff01c030b3172'
      uri: mongodb://mitocode:mitocode@host.docker.internal:27017
      authentication-database: admin

info:
  app:
    app-name: Microservicio Product Service 
    description: Módulo de la arquitectura que disponibiliza información de los Productos
    version: 1.0

management:
  auditevents:
    enable: true
  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /actuator
  endpoint:
    health:
      group:
        custom:
          include: diskSpace, ping, memory, mem
          show-component: always
          show-details: always
  info:
    env:
      enabled: true
  health:
    env:
      enabled: true
